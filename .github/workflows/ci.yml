name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Run Ruff linter
        run: ruff check src/

      - name: Run Ruff formatter check
        run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest
        run: |
          pytest tests/unit/ tests/integration/ -v --tb=short

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: ./miniapp
        run: npm install

      - name: Run vitest
        working-directory: ./miniapp
        run: npx vitest run

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Prepare SSH key
        id: ssh_key
        run: |
          KEY='${{ secrets.SSH_KEY }}'
          # Auto-detect base64-encoded key vs raw PEM
          if echo "$KEY" | head -1 | grep -q '^-----BEGIN'; then
            echo "key<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$KEY" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "Key appears base64-encoded, decoding..."
            echo "key<<EOF" >> "$GITHUB_OUTPUT"
            echo "$KEY" | base64 -d >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ steps.ssh_key.outputs.key }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /root/VPN4Friends || exit 1
            git fetch origin
            git reset --hard origin/master
            echo '${{ secrets.VPN_CONFIG_RAW }}' | base64 -d > vpn-config.json || echo '${{ secrets.VPN_CONFIG_RAW }}' > vpn-config.json
            docker compose up -d --build
            docker compose ps
            echo "Deploy finished at $(date)"

name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Run Ruff linter
        run: ruff check src/

      - name: Run Ruff formatter check
        run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest
        run: |
          pytest tests/unit/ tests/integration/ -v --tb=short

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: ./miniapp
        run: npm install

      - name: Run vitest
        working-directory: ./miniapp
        run: npx vitest run

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Переходим в директорию проекта
            cd /home/ubuntu/VPN4Friends
            
            # Если это git repo - делаем pull, иначе - чистим и клонируем
            if [ -d ".git" ]; then
              echo "📥 Pulling latest changes..."
              git fetch origin
              git reset --hard origin/master
            else
              echo "📦 Not a git repo, cleaning and cloning..."
              rm -rf /home/ubuntu/VPN4Friends/*
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            # Проверяем что jq установлен
            if ! command -v jq &> /dev/null; then
              echo "⚙️ Installing jq..."
              sudo apt-get update && sudo apt-get install -y jq
            fi
            
            # Генерируем .env из VPN_CONFIG_B64 JSON
            echo "🔐 Generating .env from B64 secrets..."
            echo '${{ secrets.VPN_CONFIG_B64 }}' | base64 -d | jq -r '
              # Bot
              "BOT_TOKEN=\(.bot.token)",
              "ADMIN_IDS=\(.bot.admin_ids | join(","))",
              "MINIAPP_URL=\(.bot.miniapp_url // "")",
              
              # API Public Domain for Caddy proxy
              "API_PUBLIC_DOMAIN=vpn4friends-api.whitebite.ru",
              "APP_PUBLIC_DOMAIN=vpn4friends-app.whitebite.ru",
              
              # Finland Panel (also as legacy XUI vars for backward compatibility)
              "XUI_FINLAND_URL=\(.servers.finland.panel_url)",
              "XUI_FINLAND_LOGIN=\(.servers.finland.login)",
              "XUI_FINLAND_PASSWORD=\(.servers.finland.password)",
              "XUI_FINLAND_PORT=9211",
              "XUI_API_URL=\(.servers.finland.panel_url)",
              "XUI_USERNAME=\(.servers.finland.login)",
              "XUI_PASSWORD=\(.servers.finland.password)",
              "XUI_HOST=\(.servers.finland.ip)",
              
              # Reality
              "REALITY_UUID=\(.reality.uuid)",
              "REALITY_PRIVATE_KEY=\(.reality.private_key)",
              "REALITY_PUBLIC_KEY=\(.reality.public_key)",
              "REALITY_SHORT_ID=\(.reality.short_id)",
              
              # MTProto
              "MTPROTO_PROXY_HOST=\(.mtproto.finland.host)",
              "MTPROTO_PROXY_PORT=\(.mtproto.finland.port)",
              "MTPROTO_PROXY_SECRET=\(.mtproto.finland.secret)",
              
              # Endpoints (JSON array)
              "ENDPOINTS_CONFIG=\(.endpoints | @json)",
              
              # Database
              "DATABASE_URL=sqlite+aiosqlite:////app/data/vpn_bot.db"
            ' > .env
            
            # Дописываем токены и секреты из отдельных секретов GitHub
            echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET || 'change-me-in-production-please' }}" >> .env
            
            echo "✅ .env generated"
            
            # Сборка Mini App (используем Docker чтобы не ставить node на хост)
            echo "🏗 Building Mini App..."
            docker run --rm -v $(pwd)/miniapp:/app -w /app node:20-alpine sh -c "
              npm install && \
              VITE_API_BASE_URL=https://vpn4friends-api.whitebite.ru/api npm run build
            "
            
            # Создаём директорию для базы
            mkdir -p data
            
            # Пересобираем и перезапускаем
            echo "🐳 Building and restarting containers..."
            docker compose up -d --build
            
            # Чистим старые образы
            echo "🧹 Cleaning up..."
            docker image prune -f
            
            echo "✅ Deploy complete!"
            echo ""
            echo "To check status:"
            echo "  docker compose ps"
            echo "  docker logs vpn4friends --tail=50"

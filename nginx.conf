server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    # Gzip compression for JS/CSS
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Proxy API requests to uvicorn
    location /api/ {
        proxy_pass http://vpn4friends-api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket
    location /ws {
        proxy_pass http://vpn4friends-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Serve hashed JS/CSS assets with long-term cache
    location /assets/ {
        root /usr/share/nginx/miniapp;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve frontend SPA (no cache for index.html)
    location / {
        root /usr/share/nginx/miniapp;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name vpn4friends-api.whitebite.ru;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS (which Xray handles on 443 and falls back to Nginx)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # listen 8443 ssl http2 proxy_protocol;
    # listen [::]:8443 ssl http2 proxy_protocol;
    server_name vpn4friends-api.whitebite.ru;

    # Parse PROXY protocol headers from Xray
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header proxy_protocol;

    # SSL Configuration (Certbot will generate these)
    # ssl_certificate /etc/letsencrypt/live/vpn4friends-api.whitebite.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vpn4friends-api.whitebite.ru/privkey.pem;

    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip settings for frontend assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to uvicorn
    location /api/ {
        proxy_pass http://vpn4friends-api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket
    location /ws {
        proxy_pass http://vpn4friends-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Cache hashing optimization (immutable assets)
    location /assets/ {
        root /usr/share/nginx/miniapp;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve static frontend files
    location / {
        root /usr/share/nginx/miniapp;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}


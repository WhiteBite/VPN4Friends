[project]
name = "vpn4friends"
version = "1.0.0"
description = "Telegram bot for sharing VPN with friends"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "ERA",    # eradicate - commented-out code
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument
]
# report commented-out code but never auto-delete it
unfixable = ["ERA001"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["ERA001"]                    # alembic template boilerplate
"scripts/migrate_outdated_users.py" = ["ERA001"] # legacy baseline
"src/services/xui_api.py" = ["ERA001"]           # legacy baseline
"tools/rebuild_vpn_matrix.py" = ["ERA001"]       # legacy baseline

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

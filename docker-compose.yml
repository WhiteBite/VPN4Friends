services:
  vpn4friends:
    build: .
    container_name: vpn4friends
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    network_mode: "host"

  vpn4friends_api:
    build: .
    container_name: vpn4friends-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./miniapp/dist:/app/miniapp/dist:ro
    network_mode: "host"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  api_proxy:
    image: cloudflare/cloudflared:latest
    container_name: vpn4friends-api-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: "host"

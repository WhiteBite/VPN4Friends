services:
  vpn4friends:
    build: .
    container_name: vpn4friends
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    network_mode: "host"

  vpn4friends_api:
    build: .
    container_name: vpn4friends-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./miniapp/dist:/app/miniapp/dist:ro
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8001

  nginx:
    image: nginx:alpine
    container_name: vpn4friends-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./miniapp/dist:/usr/share/nginx/miniapp:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: vpn4friends-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
